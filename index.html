<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Izin Kerja Khusus - Priamanaya Group</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#eef0f1;--panel:#fff;--ink:#14232b;--muted:#5b6b73;--line:#d3d9dc;--hv:#f5c400;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a20;--panel:#172831;--ink:#e8eef0;--muted:#9fb0b8;--line:#2b414c;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.stripe{height:12px;background:repeating-linear-gradient(-45deg,var(--hv) 0 14px,#14232b 14px 28px)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px}
#login{max-width:380px;margin:12vh auto 0;padding:0 16px}
#login .card{padding:0;overflow:hidden}#login form{padding:20px}
h1{font-size:1.25rem;margin:0 0 4px}h2{font-size:1.1rem;margin:0 0 12px}
p.sub{margin:0 0 16px;color:var(--muted)}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;min-height:44px;padding:8px 10px;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px}
button{min-height:44px;padding:8px 18px;font:inherit;font-weight:600;border:0;border-radius:4px;background:var(--ink);color:var(--bg);cursor:pointer}
button.lain{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.6}
:focus-visible{outline:3px solid var(--hv);outline-offset:2px}
.err{color:var(--err);min-height:1.5em;margin:10px 0 0}
header{background:var(--panel);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:10px 16px;max-width:980px;margin:0 auto}
.bar small{color:var(--muted);display:block}
nav{display:flex;gap:4px;max-width:980px;margin:0 auto;padding:0 12px}
nav button{background:none;color:var(--muted);border-radius:0;border-bottom:3px solid transparent}
nav button[aria-current=true]{color:var(--ink);border-color:var(--hv)}
main{max-width:980px;margin:16px auto;padding:0 16px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600}
.kosong{color:var(--muted);padding:12px 0}
.grid{display:grid;gap:0 16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.cb{display:flex;gap:8px;align-items:center;font-weight:400;margin:4px 0}.cb input{width:auto;min-height:0}
fieldset{border:1px solid var(--line);border-radius:4px;margin:16px 0;padding:8px 12px}legend{font-weight:600;padding:0 6px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px}.kpi b{display:block;font-size:1.8rem;line-height:1.1}.kpi span{color:var(--muted)}.kpi.awas{border-color:var(--err)}.kpi.awas b{color:var(--err)}
.hb{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:.9rem}.hb span{width:42%}.hb i{display:block;height:10px;background:var(--hv);border-radius:2px;min-width:3px}
.leaflet-container{font:inherit}.leaflet-container input{width:auto;min-height:0;margin:0}.leaflet-container label{display:inline;font-weight:400;margin:0}
.hidden{display:none!important}
</style>
</head>
<body>

<section id="login">
  <div class="card">
    <div class="stripe"></div>
    <form id="fLogin">
      <h1>Izin Kerja Khusus</h1>
      <p class="sub">Priamanaya Group</p>
      <label for="un">Username</label><input id="un" autocomplete="username" required>
      <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
      <p class="err" id="eLogin" role="alert"></p>
      <button id="bLogin" type="submit">Masuk</button>
    </form>
  </div>
</section>

<section id="app" class="hidden">
  <div class="stripe"></div>
  <header>
    <div class="bar">
      <div><strong id="nama"></strong><small id="info"></small></div>
      <button class="lain" id="bKeluar" type="button">Keluar</button>
    </div>
    <nav id="nav"></nav>
  </header>
  <main>
    <div id="vDash" class="hidden">
      <div class="card" style="margin-bottom:16px"><div class="grid">
        <div id="fPtW"><label for="dPt">Perusahaan</label><select id="dPt"></select></div>
        <div><label for="dHari">Periode (tanggal pengajuan)</label><select id="dHari"><option value="30">30 hari terakhir</option><option value="90">90 hari terakhir</option><option value="365">1 tahun terakhir</option><option value="0">Semua</option></select></div>
      </div></div>
      <div id="dKpi" class="grid" style="margin-bottom:16px"></div>
      <div class="card" style="margin-bottom:16px"><h2>Peta pekerjaan yang sedang berlaku</h2>
        <div id="mapDash" style="height:380px;border-radius:6px"></div>
        <p class="sub" id="infoPetaDash"></p><p id="legendaDash" style="font-size:.85rem"></p>
        <button class="lain" id="bKml" type="button">Ekspor KML</button></div>
      <div id="dGrafik" class="grid" style="margin-bottom:16px"></div>
      <div id="dDaftar"></div>
    </div>
    <div id="vIzin" class="card"><h2>Daftar izin kerja</h2><div id="tIzin"></div></div>
    <div id="vAju" class="card hidden"><h2 id="judulAju">Ajukan izin kerja</h2>
      <form id="fAju">
        <div class="grid">
          <div id="wPt" class="hidden"><label for="aPt">Perusahaan tujuan</label><select id="aPt"></select></div>
          <div><label for="aJenis">Jenis izin</label><select id="aJenis"></select></div>
          <div><label for="aProj">Nama project</label><input id="aProj" required></div>
          <div><label for="aLok">Lokasi kerja</label><input id="aLok" required></div>
          <div><label for="aLat">Latitude (opsional)</label><input id="aLat" inputmode="decimal"></div>
          <div><label for="aLng">Longitude (opsional)</label><input id="aLng" inputmode="decimal"></div>
          <div><label for="aE">UTM 48S - Easting (X)</label><input id="aE" inputmode="numeric"></div>
          <div><label for="aN">UTM 48S - Northing (Y)</label><input id="aN" inputmode="numeric"></div>
          <div><label for="aJml">Jumlah pekerja</label><input id="aJml" type="number" min="1" required></div>
          <div><label for="aShift">Shift pelaksanaan</label><input id="aShift" placeholder="mis. Shift 1" required></div>
          <div><label for="aMul">Tanggal mulai</label><input id="aMul" type="date" required></div>
          <div><label for="aSel">Tanggal selesai (maks. 7 hari)</label><input id="aSel" type="date" required></div>
        </div>
        <label>Titik lokasi pekerjaan (klik peta, isi koordinat, atau gunakan GPS)</label>
        <div id="mapAju" style="height:320px;border-radius:6px"></div>
        <p class="sub"><button class="lain" id="bGps" type="button">Gunakan lokasi saya</button> <button class="lain" id="bHapusTitik" type="button">Hapus titik</button> <span id="infoGps"></span></p>
        <label for="aDesk">Deskripsi kerja</label><textarea id="aDesk" rows="3" placeholder="mis. pengelasan dengan menggunakan gas asetilin" required></textarea>
        <label for="aAlat">Jenis peralatan yang digunakan</label><input id="aAlat">
        <div id="cek"></div>
      </form>
      <p class="err" id="eAju" role="alert"></p>
      <button id="bAju" type="submit" form="fAju">Ajukan izin</button>
    </div>
    <div id="vDok" class="card hidden">
      <button class="lain" id="bKembali" type="button">Kembali ke daftar</button>
      <h2 id="dJudul" style="margin-top:16px"></h2><p class="sub" id="dInfo"></p><div id="dRingkas"></div><div id="wMapDok" class="hidden"><div id="mapDok" style="height:260px;margin:12px 0 4px;border-radius:6px"></div><p class="sub" id="utmDok"></p></div><h2 style="margin-top:16px">Dokumen kelengkapan</h2>
      <div id="dSyarat"></div><div id="dRiwayat"></div><div id="dOps"></div>
      <div id="dKeputusan" class="hidden"><h2 style="margin-top:16px">Keputusan: <span id="dTahap"></span></h2>
        <label for="dCatatan">Catatan (wajib bila dikembalikan untuk revisi)</label><textarea id="dCatatan" rows="3"></textarea>
        <p></p><button id="bSetuju" type="button">Setujui</button> <button class="lain" id="bRevisi" type="button">Kembalikan untuk revisi</button></div><p class="err" id="eDok" role="alert"></p>
      <button id="bKirim" type="button">Kirim ke HSE</button> <button class="lain hidden" id="bUbahIsi" type="button">Ubah isian form</button> <button class="lain hidden" id="bPdf" type="button">Unduh PDF izin</button>
    </div>
    <div id="vKon" class="hidden">
      <div class="card" style="margin-bottom:16px"><h2>Tambah kontraktor</h2>
        <form id="fKon" class="grid">
          <div><label for="kNama">Nama kontraktor</label><input id="kNama" required></div>
          <div><label for="kIujp">Nomor IUJP</label><input id="kIujp" required></div>
          <div><label for="kBer">IUJP berlaku sampai</label><input id="kBer" type="date" required></div>
          <div><label>Ditunjuk untuk</label><div id="kPt"></div></div>
          <div><label class="cb"><input type="checkbox" id="kAktif" checked> Kontraktor aktif</label></div>
        </form>
        <p class="err" id="eKon" role="alert"></p>
        <button id="bKon" type="submit" form="fKon">Simpan kontraktor</button> <button class="lain hidden" id="bKonBatal" type="button">Batal</button>
      </div>
      <div class="card"><h2>Kontraktor dan IUJP</h2><div id="tKon"></div></div>
    </div>
    <div id="vUser" class="hidden">
      <div class="card" style="margin-bottom:16px">
        <h2>Tambah pengguna</h2>
        <form id="fUser" class="grid">
          <div><label for="uUn">Username</label><input id="uUn" required></div>
          <div><label for="uNama">Nama lengkap</label><input id="uNama" required></div>
          <div><label for="uPw">Password awal</label><input id="uPw" type="password" minlength="8" required></div>
          <div><label for="uPeran">Peran</label><select id="uPeran"></select></div>
          <div><label for="uPt">Perusahaan</label><select id="uPt"></select></div>
          <div><label for="uKon">Kontraktor (untuk pengawas kontraktor)</label><select id="uKon"></select></div>
          <div><label class="cb"><input type="checkbox" id="uAktif" checked> Akun aktif</label></div>
        </form>
        <p class="err" id="eUser" role="alert"></p>
        <button id="bUser" type="submit" form="fUser">Simpan pengguna</button> <button class="lain hidden" id="bUserBatal" type="button">Batal</button>
      </div>
      <div class="card"><h2>Pengguna</h2><div id="tUser"></div></div>
    </div>
  </main>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// URL Web App Apps Script (berakhiran /exec)
const API_URL = 'https://script.google.com/macros/s/AKfycbxPE4IETa-ikaaOW6lH9lqYF9lTfeOPwyktx1j-zdLDHeA0YizWZzTnztKo-Bqzd42Bhg/exec';
const LABEL = {ADMIN_GROUP:'Admin Group',ADMIN:'Admin Perusahaan',HSE:'HSE',KTT:'Kepala Teknik Tambang',PENGAWAS:'Pengawas',GROUP_VIEWER:'Pemantau Group'};
const $ = s => document.querySelector(s);
let token = null, user = null, ref = null;
try { token = sessionStorage.getItem('t'); } catch (e) {}

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tgl = v => v ? String(v).slice(0, 10) : '';

// Body dikirim sebagai teks biasa agar browser tidak membuat preflight CORS
async function api(aksi, data) {
  const r = await fetch(API_URL, {method:'POST', body:JSON.stringify(Object.assign({aksi, token}, data))});
  const teks = await r.text();
  let j;
  try { j = JSON.parse(teks); }
  catch (e) { throw new Error('API tidak menjawab dengan benar (kode ' + r.status + '). Periksa API_URL dan akses Web App.'); }
  if (!j.ok) { if (/Sesi/.test(j.error)) keluar(true); throw new Error(j.error); }
  return j.data;
}
function simpanToken(t) { token = t; try { t ? sessionStorage.setItem('t', t) : sessionStorage.removeItem('t'); } catch (e) {} }
function keluar(paksa) {
  simpanToken(null); user = null;
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  if (paksa) $('#eLogin').textContent = 'Sesi berakhir, silakan masuk lagi.';
}

function tabel(kolom, baris) {
  if (!baris.length) return '';
  return '<div class="scroll"><table><thead><tr>' + kolom.map(k => '<th>' + k[0] + '</th>').join('') + '</tr></thead><tbody>' +
    baris.map(b => '<tr>' + kolom.map(k => '<td>' + (k[3] ? k[2](b[k[1]], b) : esc(k[2] ? k[2](b[k[1]]) : b[k[1]])) + '</td>').join('') + '</tr>').join('') +
    '</tbody></table></div>';
}

async function muatIzin() {
  const d = (await api('permits.list')).sort((a, b) => menunggu(b) - menunggu(a)), n = d.filter(menunggu).length;
  $('#tIzin').innerHTML = (n ? '<p><strong>' + n + ' izin menunggu tindakan Anda.</strong></p>' : '') + tabel([['No. izin','NoIzin',n => n || '(belum bernomor)'],['Jenis','JenisIzin'],['Lokasi','Lokasi'],['Mulai','TglMulai',tgl],['Selesai','TglSelesai',tgl],['Status','StatusTampil'],['','ID',(id, b) => '<button class="' + (menunggu(b) ? '' : 'lain') + '" data-doc="' + esc(id) + '">' + (menunggu(b) ? 'Tinjau' : 'Buka') + '</button>',1]], d)
    || '<p class="kosong">Belum ada izin kerja. Form pengajuan dibuka di tahap berikutnya.</p>';
}
async function muatUser() {
  const d = await api('users.list'), k = await api('kontraktor.list');
  $('#uKon').innerHTML = '<option value="">Bukan kontraktor</option>' + k.map(x => '<option value="' + esc(x.ID) + '">' + esc(x.Nama) + '</option>').join('');
  dataUser = d;
  $('#tUser').innerHTML = tabel([['','Username',n => '<button class="lain" data-eu="' + esc(n) + '">Ubah</button>',1],['Username','Username'],['Nama','Nama'],['Peran','Peran',p => LABEL[p] || p],['Kontraktor','Kontraktor_ID',(id, b) => esc(b.Peran !== 'PENGAWAS' ? '-' : ((k.find(x => x.ID === id) || {}).Nama || 'Internal')),1],['Perusahaan','Perusahaan_ID',p => p || 'Group'],['Aktif','Aktif',a => a ? 'Ya' : 'Tidak']], d);
}

function tampil(v) {
  if (v !== 'Aju' && editAju) resetAju();
  ['Dash','Izin','Aju','Dok','Kon','User'].forEach(n => $('#v' + n).classList.toggle('hidden', n !== v));
  document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-current', b.dataset.v === v));
  ({Dash:muatDash,Izin:muatIzin,Aju:muatAju,Dok:muatDok,Kon:muatKon,User:muatUser}[v])().catch(e => alert(e.message));
}

async function mulai(d) {
  user = d;
  $('#nama').textContent = d.nama;
  $('#info').textContent = (LABEL[d.peran] || d.peran) + (d.peran === 'PENGAWAS' ? (d.kontraktorNama ? ' kontraktor ' + d.kontraktorNama : ' internal') : '') + ' - ' + d.perusahaanNama;
  const menu = [['Dash','Dashboard'],['Izin','Izin kerja']];
  ref = ref || await api('ref');
  if (d.peran === 'PENGAWAS') menu.push(['Aju','Ajukan izin']);
  if (['ADMIN_GROUP','ADMIN','HSE'].includes(d.peran)) menu.push(['Kon','Kontraktor']);
  if (d.peran === 'ADMIN' || d.peran === 'ADMIN_GROUP') {
    menu.push(['User','Pengguna']);
    ref = ref || await api('ref');
    $('#uPeran').innerHTML = ref.peran.filter(p => d.peran === 'ADMIN_GROUP' || ['HSE','KTT','PENGAWAS'].includes(p)).map(p => '<option value="' + p + '">' + esc(LABEL[p]) + '</option>').join('');
    $('#uPt').innerHTML = ref.perusahaan.filter(p => d.peran === 'ADMIN_GROUP' || p.ID === d.perusahaan).map(p => '<option value="' + esc(p.ID) + '">' + esc(p.Nama) + '</option>').join('');
  }
  $('#nav').innerHTML = menu.map(m => '<button type="button" data-v="' + m[0] + '">' + m[1] + '</button>').join('');
  $('#nav').onclick = e => { const v = e.target.dataset.v; if (v) { if (v === 'Aju') resetAju(); tampil(v); } };
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  tampil(d.peran === 'PENGAWAS' ? 'Izin' : 'Dash');
}

const menunggu = b => (user.peran === 'HSE' && ['Diajukan','Penyelesaian HSE'].includes(b.Status)) || (user.peran === 'KTT' && ['Terverifikasi HSE','Penyelesaian KTT'].includes(b.Status));
$('#bSetuju').onclick = () => putuskan('Setuju');
$('#bRevisi').onclick = () => putuskan('Revisi');
async function putuskan(keputusan) {
  $('#eDok').textContent = ''; $('#bSetuju').disabled = $('#bRevisi').disabled = true;
  try {
    const st = await api('permits.decide', {permitId, keputusan, catatan:$('#dCatatan').value});
    $('#dCatatan').value = ''; alert('Status izin sekarang: ' + st); tampil('Izin');
  } catch (err) { $('#eDok').textContent = err.message; }
  $('#bSetuju').disabled = $('#bRevisi').disabled = false;
}
function renderOps(t) {
  const st = t.status, per = user.peran, h = [], kerja = ['Terbit','Ditangguhkan'].includes(st);
  h.push('<h2 style="margin-top:16px">Pemantauan harian</h2>' + (t.inspeksi.length ?
    tabel([['Waktu','Waktu',w => new Date(w).toLocaleString('id-ID')],['Oleh','Oleh'],['Catatan','Catatan'],['LEL (%)','LEL']], t.inspeksi) : '<p class="kosong">Belum ada catatan inspeksi.</p>'));
  if (kerja && ['PENGAWAS','HSE'].includes(per)) h.push('<label for="iCat">Catatan inspeksi</label><textarea id="iCat" rows="2"></textarea><label for="iLel">Uji gas LEL (%), bila ada</label><input id="iLel" inputmode="decimal"><p></p><button type="button" data-act="inspeksi">Simpan catatan</button>');
  if (st === 'Terbit' && per === 'PENGAWAS') h.push('<h2 style="margin-top:16px">Penyelesaian pekerjaan</h2>' + ref.selesai.map((s, i) => '<label class="cb"><input type="checkbox" data-s="' + esc(s) + '"> ' + esc(s) + '</label>').join('') + '<p></p><button type="button" data-act="selesai">Ajukan penyelesaian</button>');
  if (kerja && ['HSE','KTT'].includes(per)) h.push('<h2 style="margin-top:16px">Penangguhan atau pembatalan (poin I)</h2><label for="cJenis">Tindakan</label><select id="cJenis">' +
    (st === 'Terbit' ? '<option value="Tangguhkan">Tangguhkan sementara</option>' : '<option value="Lanjutkan">Lanjutkan pekerjaan</option>') + '<option value="Batalkan">Batalkan izin</option></select>' +
    '<label for="cAlasan">Alasan</label><select id="cAlasan">' + ref.alasan.map(a => '<option>' + esc(a) + '</option>').join('') + '</select><label for="cCat">Catatan</label><textarea id="cCat" rows="2"></textarea><p></p><button type="button" data-act="batal">Simpan tindakan</button>' +
    (per === 'HSE' ? '<p class="sub">Tindakan HSE tercatat sebagai mewakili KTT.</p>' : ''));
  $('#dOps').innerHTML = h.join('');
}
$('#dOps').onclick = async e => {
  const act = e.target.dataset.act; if (!act) return;
  $('#eDok').textContent = ''; e.target.disabled = true;
  try {
    const v = id => $('#' + id).value;
    const msg = act === 'inspeksi' ? await api('inspeksi.add', {permitId, catatan:v('iCat'), lel:v('iLel')})
      : act === 'selesai' ? await api('permits.selesai', {permitId, item:[...$('#dOps').querySelectorAll('input[data-s]:checked')].map(i => i.dataset.s)})
      : await api('permits.cancel', {permitId, jenis:v('cJenis'), alasan:v('cAlasan'), catatan:v('cCat')});
    alert(msg); await muatDok();
  } catch (err) { $('#eDok').textContent = err.message; }
  e.target.disabled = false;
};
let editAju = null, detailKini = null;
function resetAju() {
  editAju = null; $('#fAju').reset(); hapusTitikAju(); $('#judulAju').textContent = 'Ajukan izin kerja'; $('#bAju').textContent = 'Ajukan izin';
}
$('#bUbahIsi').onclick = async () => {
  const t = detailKini, i = t.isi;
  editAju = permitId; await muatAju(); tampil('Aju');
  [['aJenis','jenis'],['aProj','project'],['aLok','lokasi'],['aLat','lat'],['aLng','lng'],['aJml','jumlah'],['aMul','tglMulai'],['aSel','tglSelesai'],['aShift','shift'],['aDesk','deskripsi'],['aAlat','peralatan']]
    .forEach(f => $('#' + f[0]).value = i[f[1]] == null ? '' : i[f[1]]);
  document.querySelectorAll('#cek input[data-b]').forEach(c => c.checked = (t.cek[c.dataset.b] || []).includes(c.value));
  $('#wPt').classList.add('hidden'); $('#judulAju').textContent = 'Ubah isian izin kerja'; $('#bAju').textContent = 'Simpan perubahan';
  if (i.lat !== '' && i.lng !== '') setAju(Number(i.lat), Number(i.lng), true); else hapusTitikAju();
};
$('#bPdf').onclick = async () => {
  $('#eDok').textContent = 'Membuat PDF...'; $('#bPdf').disabled = true;
  try {
    const d = await api('permits.pdf', {permitId}), bin = atob(d.data), a = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);

$('#fAju').onsubmit = async e => {
  e.preventDefault(); $('#eAju').textContent = ''; $('#bAju').disabled = true;
  const cek = {C:[],D:[],E:[],F:[]}, v = id => $('#' + id).value;
  e.target.querySelectorAll('input[data-b]:checked').forEach(i => cek[i.dataset.b].push(i.value));
  try {
    const id = await api(editAju ? 'permits.update' : 'permits.create', {permitId:editAju, perusahaan:v('aPt'), jenis:v('aJenis'), project:v('aProj'), lokasi:v('aLok'), lat:v('aLat'), lng:v('aLng'),
      jumlah:v('aJml'), tglMulai:v('aMul'), tglSelesai:v('aSel'), shift:v('aShift'), deskripsi:v('aDesk'), peralatan:v('aAlat'), cek});
    const pid = editAju || id; resetAju(); bukaDok(pid);
  } catch (err) { $('#eAju').textContent = err.message; }
  $('#bAju').disabled = false;
};
$('#fKon').onsubmit = async e => {
  e.preventDefault(); $('#eKon').textContent = ''; $('#bKon').disabled = true;
  const pts = [...$('#kPt').querySelectorAll('input:checked')].map(i => i.value).join(',');
  try {
    const x = {nama:$('#kNama').value, iujp:$('#kIujp').value, berlaku:$('#kBer').value, perusahaan:pts, aktif:$('#kAktif').checked};
    await api(editKon ? 'kontraktor.update' : 'kontraktor.save', editKon ? Object.assign({id:editKon}, x) : x); resetKon(); await muatKon();
  }
  catch (err) { $('#eKon').textContent = err.message; }
  $('#bKon').disabled = false;
};
$('#fLogin').onsubmit = async e => {
  e.preventDefault(); $('#eLogin').textContent = ''; $('#bLogin').disabled = true;
  try {
    const d = await api('login', {username:$('#un').value, password:$('#pw').value});
    simpanToken(d.token); $('#pw').value = ''; await mulai(d.user);
  } catch (err) { $('#eLogin').textContent = err.message; }
  $('#bLogin').disabled = false;
};
$('#fUser').onsubmit = async e => {
  e.preventDefault(); $('#eUser').textContent = ''; $('#bUser').disabled = true;
  try {
    await api(editUser ? 'users.update' : 'users.create', {aktif:$('#uAktif').checked, username:$('#uUn').value, nama:$('#uNama').value, password:$('#uPw').value, peran:$('#uPeran').value, perusahaan:$('#uPt').value, kontraktor:$('#uKon').value});
    resetUser(); await muatUser();
  } catch (err) { $('#eUser').textContent = err.message; }
  $('#bUser').disabled = false;
};
$('#bKeluar').onclick = () => keluar(false);

if (token) api('me').then(mulai).catch(() => keluar(false));
</script>
